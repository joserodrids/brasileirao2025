<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Classificação Brasileirão 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 30px;
      margin: 0;
    }

    h1 {
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4.5rem;
      letter-spacing: 4px;
      margin: 30px 0;
      text-transform: uppercase;
      position: relative;
      background: linear-gradient(45deg, #00b300, #ffd700, #009c3b, #002776);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: title-glow 2s ease-in-out infinite alternate;
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
    }

    @keyframes title-glow {
      0% { filter: drop-shadow(0 0 5px rgba(255,215,0,0.3)); }
      100% { filter: drop-shadow(0 0 15px rgba(255,215,0,0.6)); }
    }

    table {
      width: 80%;
      margin: 0 auto 30px auto;
      border-collapse: collapse;
      background-color: #1e1e1e;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    th {
      background-color: #333;
      color: #fff;
      text-align: left;
    }

    tr {
      border-left: 6px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }

    tr:nth-child(even) {
      background-color: #1a1a1a;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.05) !important;
      cursor: pointer;
    }

    tr:hover::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
      pointer-events: none;
    }

    .campeao.libertadores { border-left: 6px solid gold; font-weight: bold; }
    .libertadores { border-left: 6px solid #00bfff; }
    .pre-libertadores { border-left: 6px solid #aa66cc; }
    .sul-americana { border-left: 6px solid #66cc66; }
    .rebaixado { border-left: 6px solid red; }

    .comentario { font-style: italic; color: #bbb; font-size: 0.9em; }

    .time-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-info img {
      width: 20px;
      height: 20px;
    }

    .posicao {
      width: 25px;
      display: inline-block;
    }

    .legenda {
      width: 80%;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .legenda strong {
      display: block;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .legenda-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }

    .legenda span {
      width: 16px;
      height: 16px;
      display: inline-block;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .libertadores-color { background-color: #00bfff; }
    .pre-libertadores-color { background-color: #aa66cc; }
    .sul-americana-color { background-color: #66cc66; }
    .rebaixado-color { background-color: red; }

  </style>
</head>
